<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C64 in the browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --case:#DCD3C0; --case-edge:#C6BAA0; --ink:#3A2E24; --muted:#6F6253;
  --key:#5B4636; --key-hi:#6E5643; --key-ink:#F3EBDC; --bezel:#24201C; --led:#D8332A; --led-off:#6B5A4C;
  --drop:#EAE3D4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --case:#27221D; --case-edge:#3A3229; --ink:#ECE3D2; --muted:#A99C8A; --key:#4C3B2E; --key-hi:#5E4A3A;
  --bezel:#100E0C; --led-off:#4A3E34; --drop:#302922; } }
:root[data-theme="dark"]{ --case:#27221D; --case-edge:#3A3229; --ink:#ECE3D2; --muted:#A99C8A; --key:#4C3B2E; --key-hi:#5E4A3A;
  --bezel:#100E0C; --led-off:#4A3E34; --drop:#302922; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--case); color:var(--ink); font-family:Chivo, "Segoe UI", system-ui, sans-serif; line-height:1.5}
main{max-width:980px; margin:0 auto; padding:24px 16px 48px}
h1{font-weight:800; font-size:clamp(1.4rem,3.5vw,2rem); letter-spacing:-0.01em; margin:0 0 4px}
.sub{color:var(--muted); margin:0 0 20px; max-width:62ch}
.monitor{background:var(--bezel); border-radius:18px; padding:clamp(10px,2.5vw,28px); box-shadow:0 2px 0 var(--case-edge)}
canvas{display:block; width:100%; aspect-ratio:384/272; image-rendering:pixelated; image-rendering:crisp-edges; border-radius:6px; background:#000}
.deck{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:16px; padding:14px; border-radius:10px;
  background:linear-gradient(var(--case-edge),var(--case-edge)) top/100% 3px no-repeat, var(--case)}
.led{width:14px; height:6px; border-radius:2px; background:var(--led-off); margin-right:6px}
.led.on{background:var(--led); box-shadow:0 0 8px var(--led)}
button,.btn{font:600 0.95rem Chivo, system-ui, sans-serif; color:var(--key-ink); background:var(--key); border:0; border-radius:6px;
  padding:9px 14px; cursor:pointer; box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}
button:hover,.btn:hover{background:var(--key-hi)}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
button:disabled{opacity:.45; cursor:default}
#disksel{font:600 .9rem Chivo,system-ui,sans-serif; color:var(--key-ink); background:var(--key); border:0; border-radius:6px; padding:9px 10px; max-width:16em}
#joy[aria-pressed="true"]{background:var(--led); color:#fff}
.dled{font:600 .72rem Chivo,system-ui,sans-serif; color:var(--muted); padding:2px 6px 2px 16px; position:relative}
.dled::before{content:""; position:absolute; left:4px; top:50%; width:8px; height:4px; margin-top:-2px; border-radius:1px; background:var(--led-off)}
.dled.on::before{background:var(--led); box-shadow:0 0 6px var(--led)}
#status{color:var(--muted); font-size:.9rem; margin-left:auto; min-height:1.4em}
#setup{margin-top:20px; padding:20px; border:2px dashed var(--case-edge); border-radius:12px; background:var(--drop)}
#setup.over{border-color:var(--ink)}
#setup h2{margin:0 0 6px; font-size:1.15rem}
#setup p{margin:0 0 12px; max-width:64ch}
.roms{list-style:none; padding:0; margin:0 0 16px; display:grid; gap:6px}
.roms li{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.roms .mark{width:1.2em; font-weight:800}
.roms strong{color:var(--ink); font-weight:600; min-width:5.5em}
.roms span.d{color:var(--muted); font-size:.92rem}
details{margin-top:18px; color:var(--muted)}
summary{cursor:pointer; color:var(--ink); font-weight:600}
dl{display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; margin:10px 0 0}
dt{font-weight:600; color:var(--ink)} dd{margin:0}
kbd{font:inherit; font-size:.9em; padding:0 5px; border:1px solid var(--case-edge); border-radius:4px; background:var(--drop)}
[hidden]{display:none!important}
.about{margin-top:18px; color:var(--ink)}
.about h3{font-size:1rem; margin:16px 0 6px}
.about p{max-width:70ch}
.about a{color:var(--ink)}
.credits{display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:0}
.credits dt{font-weight:600} .credits dd{margin:0; color:var(--muted)}
@media (max-width:560px){.credits{grid-template-columns:1fr} .credits dd{margin-bottom:6px}}
.license{white-space:pre-wrap; font-size:.78rem; max-height:50vh; overflow:auto; background:var(--drop); padding:12px; border-radius:8px}
/* touch play mode */
.tp,.tkeys{display:none}
.dkeys{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; align-items:center}
.dkeys button{padding:7px 10px; font-size:.8rem; user-select:none; -webkit-user-select:none}
.dkeys button.down{background:var(--led)}
.dkeys .sep{width:10px}
body.touch .dkeys{display:none}
#kbd{position:fixed; left:0; bottom:0; width:1px; height:1px; opacity:0; border:0; padding:0; resize:none; font-size:16px}
body.touch main{max-width:none; padding:10px 10px 40px}
body.touch .play{display:grid; grid-template-columns:1fr 1fr; grid-template-areas:"center center" "left right"; gap:12px 8px; align-items:center}
body.touch .center{grid-area:center} body.touch .tp-left{grid-area:left} body.touch .tp-right{grid-area:right}
body.touch .tp{display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center; touch-action:none; user-select:none; -webkit-user-select:none}
body.touch .tkeys{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:100%}
.tkeys button{padding:9px 10px; font-size:.8rem; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none}
.tkeys button.down,#tshift[aria-pressed="true"]{background:var(--led); color:#fff}
.stick{position:relative; width:min(42vw,170px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 50% 50%, var(--case-edge) 0 34%, var(--bezel) 35% 100%); box-shadow:inset 0 0 0 3px var(--key); touch-action:none}
.knob{position:absolute; left:50%; top:50%; width:44%; aspect-ratio:1; margin:-22% 0 0 -22%; border-radius:50%; background:var(--led); box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.25); pointer-events:none}
.fire{width:min(30vw,120px); aspect-ratio:1; border-radius:50%; font-size:1.05rem; font-weight:800; background:var(--led); color:#fff; touch-action:none; -webkit-user-select:none; user-select:none; box-shadow:0 4px 0 rgba(0,0,0,.35), inset 0 -5px 0 rgba(0,0,0,.25)}
.fire.down{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35), inset 0 -2px 0 rgba(0,0,0,.25)}
body.touch h1, body.touch .sub{display:none}
@media (orientation: landscape){
  body.touch .play{grid-template-columns:1fr auto 1fr; grid-template-areas:"left center right"; min-height:calc(100dvh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  body.touch .monitor{padding:6px; border-radius:10px; width:fit-content}
  body.touch canvas{height:calc(100dvh - 92px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); width:auto; max-width:100%}
  body.touch .stick{width:min(20vw,150px, 42dvh)} body.touch .fire{width:min(13vw,110px, 30dvh)} body.touch canvas{height:calc(100dvh - 34px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<main>
  <h1>Commodore 64</h1>
  <p class="sub" data-i18n="sub"></p>

  <div class="play">
    <div class="tp tp-left">
      <div class="stick" id="stick" data-i18n-aria="ariaStick"><div class="knob" id="knob"></div></div>
      <div class="tkeys"><button data-k="STOP">RUN/STOP</button><button id="tshift" aria-pressed="false">SHIFT</button><button data-k="F1">F1</button><button data-k="F3">F3</button><button data-k="F5">F5</button><button data-k="F7">F7</button></div>
    </div>
    <div class="center">
      <div class="monitor"><canvas id="screen" width="384" height="272" data-i18n-aria="ariaScreen"></canvas></div>
      <div class="dkeys" data-i18n-aria="ariaKeys">
        <button data-k="F1">F1</button><button data-k="LSH F1">F2</button><button data-k="F3">F3</button><button data-k="LSH F3">F4</button>
        <button data-k="F5">F5</button><button data-k="LSH F5">F6</button><button data-k="F7">F7</button><button data-k="LSH F7">F8</button>
        <span class="sep"></span>
        <button data-k="STOP">RUN/STOP</button><button data-restore="1">RESTORE</button><button data-k="HOME">CLR/HOME</button><button data-k="CBM">C=</button><button class="pastebtn" data-i18n="pasteText"></button>
      </div>
    </div>
    <div class="tp tp-right">
      <button class="fire" id="fire" data-i18n="fire" data-i18n-aria="fire"></button>
      <div class="tkeys"><button data-k="RET">RETURN</button><button data-k="SPC">SPACE</button><button data-k="Y">Y</button><button data-k="N">N</button><button id="kbdbtn" data-i18n-aria="ariaKbd">⌨︎</button><button class="pastebtn" data-i18n="paste"></button></div>
    </div>
  </div>
  <textarea id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true"></textarea>

  <div class="deck">
    <span class="led" id="led" aria-hidden="true"></span>
    <button id="reset" disabled data-i18n="reset"></button>
    <button id="loadprg" disabled data-i18n="load"></button>
    <span class="dled" id="dled" title="1541">1541</span>
    <button id="drvmode" data-i18n-title="titleDrive" hidden></button>
    <button id="dlDisk" hidden data-i18n="dlDisk"></button>
    <select id="disksel" hidden data-i18n-aria="ariaDisk"></select>
    <button id="touchbtn" aria-pressed="false"></button>
    <button id="joy" aria-pressed="false" data-i18n-title="titleJoy"></button>
    <button id="joyport" data-i18n-title="titlePort">Port 2</button>
    <button id="sound" aria-pressed="true"></button>
    <button id="romsbtn" data-i18n="roms"></button>
    <button id="langbtn" lang="no">Norsk</button>
    <input type="file" id="prgfile" accept=".prg,.d64,.zip" hidden>
    <span id="status" role="status"></span>
  </div>

  <section id="setup" hidden>
    <h2 data-i18n="setupH"></h2>
    <p data-i18n="setupP"></p>
    <ul class="roms">
      <li><span class="mark" id="m-basic">·</span><strong>BASIC</strong><span class="d" data-i18n="romBasic"></span></li>
      <li><span class="mark" id="m-kernal">·</span><strong>KERNAL</strong><span class="d" data-i18n="romKernal"></span></li>
      <li><span class="mark" id="m-chargen">·</span><strong data-i18n="romCharH"></strong><span class="d" data-i18n="romChar"></span></li>
      <li><span class="mark" id="m-drive">·</span><strong>1541 DOS</strong><span class="d" data-i18n="romDrive"></span></li>
    </ul>
    <label class="btn" for="romfile" data-i18n="choose"></label>
    <input type="file" id="romfile" multiple hidden>
    <span class="d" style="margin-left:8px;color:var(--muted)" data-i18n="orDrag"></span>
  </section>

  <details>
    <summary data-i18n="helpH"></summary>
    <div data-i18n="help"></div>
  </details>
  <details class="about" id="about">
    <summary data-i18n="aboutH"></summary>
    <div data-i18n="about"></div>
    <details><summary data-i18n="licenseH"></summary><pre class="license"><!--LICENSE_TEXT--></pre></details>
  </details>
</main>

/*CORE*/

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('screen'), ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H), img32 = new Uint32Array(img.data.buffer);
  const roms = { basic: null, kernal: null, chargen: null, drive: null, driveLo: null, driveHi: null };
  let c64 = null, running = false, frameNo = 0;
  const typeQ = [];
  // status() takes a string or a function, so the current message can be re-rendered in a new language
  let statusMsg = '';
  const status = t => { statusMsg = t; $('status').textContent = typeof t === 'function' ? t() : t; };

  // ---- Language: English is the default; Norwegian is available via the language button ----

      pasteText: 'Paste text', paste: 'Paste', fire: 'FIRE',
      reset: 'Power cycle', load: 'Load program', dlDisk: 'Download disk', roms: 'Change ROM files',

      touchOn: 'Touch on', touchOff: 'Touch off', joyOn: 'Joystick on', joyOff: 'Joystick off', soundOn: 'Sound on', soundOff: 'Sound off',
      setupH: 'Add the ROM files',
      setupP: 'The emulator needs the contents of three ROM chips from a C64. The ROM files are copyrighted works of Commodore and are not included. Use files you have the right to use, for example read out from your own machine, and drop them here. They are stored only in this browser, so you only do this once.',
      romBasic: 'The BASIC V2 interpreter, 8 kB (Commodore 901226-01)',

      helpH: 'Keyboard and controls',
      help: `<dl>
      <dt><kbd>Esc</kbd></dt><dd>RUN/STOP (with <kbd>PgUp</kbd> for RUN/STOP + RESTORE)</dd>

      <dt>Left <kbd>Alt</kbd></dt><dd>The Commodore key (C=)</dd>

      <dt><kbd>Insert</kbd></dt><dd>INST</dd>
      <dt><kbd>F1</kbd>–<kbd>F8</kbd></dt><dd>The function keys. On a Mac, hold <kbd>fn</kbd>, use <kbd>Ctrl</kbd>+<kbd>1</kbd>–<kbd>8</kbd>, or use the buttons below the screen.</dd>
      <dt>Arrow keys</dt><dd>The cursor</dd>
      <dt><kbd>§</kbd> or <kbd>\`</kbd></dt><dd>Left arrow (←)</dd>
      <dt>Right <kbd>Option</kbd> (short tap)</dt><dd>Toggles joystick mode. In joystick mode the arrow keys steer and <kbd>space</kbd> fires. The rest of the keyboard works as usual.</dd>
      <dt>Port 1 / Port 2</dt><dd>Most games use port 2. If nothing happens when you steer, switch ports with the button.</dd>
      <dt>Numpad <kbd>8</kbd> <kbd>2</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>0</kbd></dt><dd>Always joystick, 0 fires</dd>
      <dt>Mobile</dt><dd>"Touch on" shows a virtual joystick (left) and fire button (right), and buttons for RUN/STOP, RETURN, SPACE, F1–F7, Y and N. SHIFT applies to the next key, so SHIFT + F1 gives F2. Sound starts when you lift your finger after the first tap; on an iPhone with an older iOS the silent switch must be off. ⌨︎ opens the phone keyboard for typing. Turn the phone sideways for the largest screen.</dd>
      <dt>"Paste"</dt><dd>Types text from the clipboard, such as a BASIC program, as if you typed it. Also works on mobile.</dd>
      <dt><kbd>Ctrl</kbd>+<kbd>V</kbd></dt><dd>Pastes text, such as a BASIC program</dd>
    </dl>
    <p>The disk drive: with a 1541 ROM added, a real 1541 with its own processor is emulated, so games with fast loaders work. The 1541 mode button switches between "real + fast LOAD" (recommended: normal LOAD commands are instant, everything else goes through the real drive), "fully real" and "off". While the disk spins, the emulator runs in turbo without sound. The light next to "1541" is on while the drive works. If a program saves something to the disk, a "Download disk" button appears.</p>
    <p>Punctuation follows the character you actually type, so non-US keyboards work as expected. Program files (.prg), disk images (.d64) and .zip files containing them can be dragged straight onto the page. Zip files are unpacked automatically, and if they contain several disks you get a disk selector to switch disk sides. With a disk inserted, <code>LOAD"$",8</code> and <code>LIST</code> show its contents, and <code>LOAD"NAME",8,1</code> loads a specific program.</p>`,

      <dt>Lasse Öörni (Cadaver)</dt><dd>c64gameframework. Its example game was used to test the 1541 emulation and fast loader; not included.</dd>
      <dt>Chivo</dt><dd>Typeface by Omnibus-Type, SIL Open Font License 1.1, served by Google Fonts.</dd>

    <h3>ROM files and trademarks</h3>
    <p>The ROM files (BASIC, KERNAL, character set and 1541 DOS) are copyrighted works of Commodore. They are not part of the emulator or its license and are not included; you add them yourself. "Commodore" and "Commodore 64" are trademarks of their respective owners. This project is not affiliated with them.</p>`,

    if (!running || e.metaKey || (e.ctrlKey && !e.altKey)) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code in JOY) { joy |= JOY[e.code]; applyJoy(); e.preventDefault(); return; }
    if (joyMode && e.code in JOYMODE) { joy |= JOYMODE[e.code]; applyJoy(); e.preventDefault();
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur(); return; }
    if (e.key === 'PageUp') { c64.restore(); e.preventDefault(); return; }
    const keys = mapKey(e); if (!keys) return;
    e.preventDefault();
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    if (e.repeat && pressed.has(e.code)) return;
    pressed.set(e.code, { keys, frame: frameNo, up: false }); applyMatrix();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'AltRight') { if (optTap && running) setJoyMode(!joyMode); optTap = false; return; }
    if (!running) return;
    if (e.code in JOY) { joy &= ~JOY[e.code]; applyJoy(); return; }
    if (e.code in JOYMODE) { joy &= ~JOYMODE[e.code]; applyJoy(); if (joyMode) return; }
    const p = pressed.get(e.code); if (p) p.up = true;
  });
  window.addEventListener('blur', () => { pressed.clear(); joy = 0; optTap = false; if (c64) { applyJoy(); applyMatrix(); } });

  // ---- Typing / paste via the keyboard buffer ----
  function typeText(t) {
    for (const ch of t) {
      const c = ch.charCodeAt(0);
      if (ch === '\n' || ch === '\r') { if (typeQ[typeQ.length - 1] !== 13 || ch === '\n') typeQ.push(13); }
      else if (c >= 97 && c <= 122) typeQ.push(c - 32);
      else if (ch === '£') typeQ.push(0x5c);
      else if (ch === '\b') typeQ.push(20);
      else if (c >= 0x20 && c <= 0x5d) typeQ.push(c);
    }
  }
  window.addEventListener('paste', e => {
    if (!running) return; const t = e.clipboardData.getData('text'); if (t) { typeText(t.replace(/\r\n/g, '\n')); e.preventDefault(); }
  });

  // ---- Audio (Web Audio; starts on the first click or keypress) ----
  let actx = null, gainNode = null, nextT = 0, soundOn = true;
  function ensureAudio() {
    if (!soundOn) return;
    try {
      if (!actx) {
        // iOS 17+: play even when the ringer switch is on silent
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
        actx = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = actx.createGain(); gainNode.gain.value = 0.9; gainNode.connect(actx.destination);
        if (c64) c64.sid.setRate(actx.sampleRate);
      }
      if (actx.state !== 'running') {
        const r = actx.resume(); if (r && r.catch) r.catch(() => {});
        // iOS only unlocks Web Audio when something is started inside the gesture: a 1-sample silent buffer
        const b = actx.createBuffer(1, 1, actx.sampleRate), src = actx.createBufferSource();
        src.buffer = b; src.connect(actx.destination); src.start(0);
      }
    } catch (e) { status(() => T().sNoSound); }
  }
  // iOS Safari accepts touchend/click (not touchstart/pointerdown) as permission to start sound
  window.addEventListener('pointerdown', ensureAudio);
  window.addEventListener('touchend', ensureAudio, { passive: true });
  window.addEventListener('click', ensureAudio);
  window.addEventListener('keydown', ensureAudio);
  const audioLive = () => soundOn && actx && actx.state === 'running';
  function flushAudio() {
    const sid = c64.sid, n = sid.n; sid.n = 0;
    if (!n || !audioLive()) return;
    const b = actx.createBuffer(1, n, actx.sampleRate);
    b.copyToChannel(sid.buf.subarray(0, n), 0);
    const src = actx.createBufferSource(); src.buffer = b; src.connect(gainNode);
    if (nextT < actx.currentTime + 0.01) nextT = actx.currentTime + 0.04;
    src.start(nextT); nextT += n / actx.sampleRate;
  }

  // ---- Main loop ----
  const FRAME_MS = (LINES * CPL) / 985.248;
  let acc = 0, last = performance.now();
  function runOne() {
    frameNo++;
    let changed = false;
    for (const [code, p] of pressed) if (p.up && frameNo - p.frame >= (p.hold || 3)) { pressed.delete(code); changed = true; }
    if (changed) applyMatrix();
    if (typeQ.length && c64.ram[0xc6] === 0) { let n = 0;
      while (n < 10 && typeQ.length) c64.ram[0x277 + n++] = typeQ.shift(); c64.ram[0xc6] = n; }
    c64.runFrame();
    flushAudio();
  }
  let turboOn = false;
  function loop(now) {
    const dt = Math.min(now - last, 100); last = now;
    if (running) {
      let ran = 0;
      const drv = c64.drive, loading = turbo && drv && drv.motor;
      if (loading) {
        // Turbo while the disk spins: run as many frames as fit in ~14 ms, without sound
        turboOn = true; const t0 = performance.now();
        while (performance.now() - t0 < 14 && ran < 20) { runOne(); c64.sid.n = 0; ran++; }
        acc = 0;
      } else if (turboOn) { turboOn = false; nextT = 0; acc = 0; }
      if (loading) {} else if (audioLive()) {
        // The sound card's clock sets the pace, so audio never drifts or stutters
        acc = 0;
        if (nextT < actx.currentTime) nextT = actx.currentTime + 0.04;
        while (nextT - actx.currentTime < 0.1 && ran < 5) { runOne(); ran++; }
      } else {
        acc += dt;
        while (acc >= FRAME_MS) { acc -= FRAME_MS; runOne(); ran++; }
      }
      if (ran) { img32.set(c64.frame); ctx.putImageData(img, 0, 0); }
      $('dled').classList.toggle('on', !!(drv && (drv.led || drv.motor)));
      $('dlDisk').hidden = !(drv && drv.dirty);
    } else acc = 0;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---- Wiring ----
  $('reset').onclick = e => { e.currentTarget.blur(); boot(); };
  $('loadprg').onclick = e => { e.currentTarget.blur(); $('prgfile').click(); };
  $('prgfile').onchange = e => { handleFiles([...e.target.files]); e.target.value = ''; };
  $('romfile').onchange = e => { handleFiles([...e.target.files]); e.target.value = ''; };
  $('sound').onclick = e => {
    const b = e.currentTarget; b.blur(); soundOn = !soundOn;
    b.textContent = soundOn ? T().soundOn : T().soundOff; b.setAttribute('aria-pressed', String(soundOn));
    if (soundOn) ensureAudio(); else if (actx) actx.suspend();
  };
  $('joy').onclick = e => { e.currentTarget.blur(); if (running) setJoyMode(!joyMode); };
  $('joyport').onclick = e => {
    e.currentTarget.blur(); joyPort = joyPort === 2 ? 1 : 2; joy = 0; applyJoy(); showJoy();
    try { localStorage.setItem('c64.joyport', String(joyPort)); } catch (err) {}
    status(() => T().sPort(joyPort));
  };
  showJoy();
  $('drvmode').onclick = e => {
    e.currentTarget.blur();
    driveMode = driveMode === 'hybrid' ? 'real' : driveMode === 'real' ? 'off' : 'hybrid';
    try { localStorage.setItem('c64.drivemode', driveMode); } catch (err) {}
    if (running) boot();
    status(() => T().modeMsg[driveMode]);
  };
  $('dlDisk').onclick = e => {
    e.currentTarget.blur();
    const img = c64.drive && c64.drive.exportD64(); if (!img) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([img], { type: 'application/octet-stream' }));
    a.download = diskName.replace(/\.d64$/i, '') + '-lagret.d64'; a.click();
  };
  // ---- Touch controls ----
  let touchMode = false;
  function setTouch(on) {
    touchMode = on; document.body.classList.toggle('touch', on);
    const b = $('touchbtn'); b.textContent = on ? T().touchOn : T().touchOff; b.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('c64.touch', on ? '1' : '0'); } catch (e) {}
  }
  { let pref = null; try { pref = localStorage.getItem('c64.touch'); } catch (e) {}
    setTouch(pref ? pref === '1' : matchMedia('(pointer: coarse)').matches); }
  $('touchbtn').onclick = e => { e.currentTarget.blur(); setTouch(!touchMode); };
  // virtual stick: 8 directions from the angle, with a dead zone in the middle
  const stick = $('stick'), knob = $('knob'); let stickId = null;
  const DIRS = [8, 8|2, 2, 2|4, 4, 4|1, 1, 1|8]; // right, down-right, down, down-left, left, up-left, up, up-right
  function stickMove(e) {
    const r = stick.getBoundingClientRect(), R = r.width / 2;
    let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
    const d = Math.hypot(dx, dy), lim = R * 0.55;
    const kx = d > lim ? dx / d * lim : dx, ky = d > lim ? dy / d * lim : dy;
    knob.style.transform = `translate(${kx}px, ${ky}px)`;
    let bits = 0;
    if (d > R * 0.18) bits = DIRS[(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8];
    if ((tjoy & 15) !== bits) { tjoy = (tjoy & 16) | bits; applyJoy(); }
  }
  function stickEnd(e) {
    if (e.pointerId !== stickId) return;
    stickId = null; knob.style.transform = ''; tjoy &= 16; applyJoy();
  }
  stick.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
  stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);
  const fire = $('fire');
  const fireDown = on => { fire.classList.toggle('down', on); tjoy = on ? tjoy | 16 : tjoy & 15; applyJoy(); if (on && navigator.vibrate) navigator.vibrate(8); };
  fire.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); fire.setPointerCapture(e.pointerId); fireDown(true); });
  fire.addEventListener('pointerup', () => { fireDown(false); ensureAudio(); }); fire.addEventListener('pointercancel', () => fireDown(false));
  fire.addEventListener('contextmenu', e => e.preventDefault()); stick.addEventListener('contextmenu', e => e.preventDefault());
  // C64 keys as touch buttons: held while the finger is down
  document.querySelectorAll('.dkeys [data-restore]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); if (running) c64.restore(); }));
  // On-screen C64 keys. On touch screens the touch events are used directly (most reliable on iOS Safari);
  // the finger is tracked until it lifts, and a quick tap is held for at least 6 frames (120 ms).
  let shiftLatch = false;
  const tshift = $('tshift');
  const setShift = on => { shiftLatch = on; tshift.setAttribute('aria-pressed', String(on)); };
  const shiftTap = e => { e.preventDefault(); ensureAudio(); setShift(!shiftLatch); };
  const useTouch = 'ontouchstart' in window;
  if (useTouch) tshift.addEventListener('touchstart', shiftTap, { passive: false }); else tshift.addEventListener('pointerdown', shiftTap);
  document.querySelectorAll('.tkeys [data-k], .dkeys [data-k]').forEach(b => {
    const code = 'btn-' + b.dataset.k + '-' + Math.random();
    let active = false;
    const down = e => {
      e.preventDefault(); if (!running || active) return;
      active = true; ensureAudio(); b.classList.add('down');
      let keys = b.dataset.k.split(' '), label = b.textContent;
      if (shiftLatch && b.closest('.tkeys')) { if (!keys.includes('LSH')) keys = ['LSH', ...keys]; label = 'SHIFT+' + label; setShift(false); }
      pressed.set(code, { keys, frame: frameNo, up: false, hold: 6 }); applyMatrix();
      status(() => T().sKey(label));
    };
    const up = e => { if (!active) return; active = false; b.classList.remove('down'); const p = pressed.get(code); if (p) p.up = true; };
    if (useTouch && b.closest('.tkeys')) {
      b.addEventListener('touchstart', down, { passive: false });
      b.addEventListener('touchend', e => { e.preventDefault(); ensureAudio(); up(e); }, { passive: false });
      b.addEventListener('touchcancel', up);
    } else {
      b.addEventListener('pointerdown', e => { try { b.setPointerCapture(e.pointerId); } catch (err) {} down(e); });
      b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
    }
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  // Paste: read the clipboard (Safari shows a «Lim inn» bubble); if that's not allowed, ask in a dialog
  async function pasteText() {
    if (!running) { status(() => T().sRomsFirst); return; }
    let t = null;
    try { if (navigator.clipboard && navigator.clipboard.readText) t = await navigator.clipboard.readText(); } catch (e) { t = null; }
    if (!t) t = prompt(T().pastePrompt, '');
    if (t) { typeText(t.replace(/\r\n/g, '\n')); status(() => T().sPasting(t.length)); }
  }
  document.querySelectorAll('.pastebtn').forEach(b => b.addEventListener('click', e => { e.preventDefault(); b.blur(); pasteText(); }));
  // phone keyboard: a hidden text field feeds the C64 keyboard buffer
  const kbd = $('kbd');
  $('kbdbtn').addEventListener('click', () => { kbd.value = ''; kbd.focus(); });
  kbd.addEventListener('beforeinput', e => {
    if (!running) return;
    if (e.inputType === 'insertText' && e.data) typeText(e.data);
    else if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') typeText('\r');
    else if (e.inputType === 'deleteContentBackward') typeText('\b');
    else if (e.inputType === 'insertFromPaste' || e.inputType === 'insertReplacementText') {
      const t = e.data || (e.dataTransfer && e.dataTransfer.getData('text/plain')) || ''; if (t) typeText(t.replace(/\r\n/g, '\n'));
    }
    e.preventDefault();
  });
  kbd.addEventListener('keydown', e => { if (e.key === 'Enter') { typeText('\r'); e.preventDefault(); } });
  $('disksel').onchange = e => { const d = diskList[+e.target.value]; e.target.blur(); if (d) insertDisk(d.b, d.name, false); };
  $('romsbtn').onclick = e => { e.currentTarget.blur(); $('setup').hidden = !$('setup').hidden; };
  document.addEventListener('dragover', e => { e.preventDefault(); $('setup').classList.add('over'); });
  document.addEventListener('dragleave', () => $('setup').classList.remove('over'));
  document.addEventListener('drop', e => { e.preventDefault(); $('setup').classList.remove('over'); handleFiles([...e.dataTransfer.files]); });

  // re-render the labels that depend on state when the language changes
  function refreshLabels() {
    showJoy(); showDriveMode();
    const sb = $('sound'); sb.textContent = soundOn ? T().soundOn : T().soundOff;
    const tb = $('touchbtn'); tb.textContent = touchMode ? T().touchOn : T().touchOff;
  }
  $('langbtn').onclick = e => {
    e.currentTarget.blur(); lang = lang === 'en' ? 'no' : 'en';
    try { localStorage.setItem('c64.lang', lang); } catch (err) {}
    applyLang();
  };
  applyLang();

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  loadRoms().then(r => {
    if (r && r.basic && r.kernal && r.chargen) { Object.assign(roms, r); markRoms(); boot(); if (!roms.drive) status(() => T().sTip); }
    else { markRoms(); $('setup').hidden = false; status(() => T().sWaiting); }
  });
})();
</script>
</body>
</html>
